# The resources a service needs when it runs with --spring.profiles.active=local, as official images.
# The published ports are a contract with infra/src/main/resources/ecom-infra-local.yml: change one, change the other.
# Start and stop with local.ps1 (up | down | reset | status).
name: ecom-local

services:
  # ecom.client.rabbit.core -> localhost:5672 (login guest/guest, which RabbitMQ only accepts from this machine).
  # The management UI is on http://localhost:15672. Exchanges and queues are declared by the services.
  rabbitmq:
    image: rabbitmq:${RABBITMQ_TAG}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ecom.client.kafka.core -> localhost:9092. Single node in KRaft mode (no ZooKeeper). Topics are created on first use.
  # Not started by default, since the services publish through RabbitMQ: add --profile kafka to start it.
  kafka:
    image: apache/kafka:${KAFKA_TAG}
    profiles: ["kafka"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  # ecom.client.dynamodb.main -> http://localhost:8000. Keeps its tables in a volume.
  dynamodb:
    image: amazon/dynamodb-local:${DYNAMODB_TAG}
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    user: root
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data

  # The services' databases (spring.datasource.* in each service's application-local.yml): localhost:5432, user and
  # password "ecom". POSTGRES_DB creates identity_db on first start; the other databases come from postgres-init/.
  postgres:
    image: postgres:${POSTGRES_TAG}
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      POSTGRES_DB: identity_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom -d identity_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # Nothing in ecom uses MongoDB yet; it is here so it is ready when its client is added (mongodb://localhost:27017).
  mongo:
    image: mongo:${MONGO_TAG}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  postgres-data:
  rabbitmq-data:
  kafka-data:
  dynamodb-data:
  mongo-data:
