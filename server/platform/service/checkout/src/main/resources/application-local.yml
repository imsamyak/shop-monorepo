# Runs against the containers from bootstrap/local (bootstrap/local/local.ps1 up) and the other services on this machine.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/checkout_db}
    username: ${SPRING_DATASOURCE_USERNAME:ecom}
    password: ${SPRING_DATASOURCE_PASSWORD:ecom}
  jpa:
    hibernate:
      ddl-auto: update

services:
  identity:
    base-url: ${IDENTITY_SERVICE_URL:http://localhost:8086}
    # The client this service logs in as when it calls inventory; identity knows the same secret (identity.service-clients).
    client-id: checkout-service
    client-secret: ${CHECKOUT_CLIENT_SECRET:dev-checkout-client-secret}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8083}
  listing:
    base-url: ${LISTING_SERVICE_URL:http://localhost:8081}

ecom:
  security:
    jwt:
      jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8086/.well-known/jwks.json}
  outbox:
    # Publish the checkout events through the RabbitMQ client the profile calls "core"; infra says where it is.
    client: rabbit.core
