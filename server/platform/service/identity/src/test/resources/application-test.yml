spring:
  datasource:
    url: jdbc:h2:mem:identity_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

identity:
  bcrypt-strength: 4
  jwt:
    # Generated on the first test run and kept under target/, which is deleted by `mvn clean`.
    dev-key-file: target/identity-test/private.pem
  lockout:
    max-attempts: 3
  password-reset:
    link-base-url: http://storefront.test/reset-password
  service-clients:
    checkout-service: test-client-secret
