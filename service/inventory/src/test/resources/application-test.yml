spring:
  datasource:
    url: jdbc:h2:mem:inventory_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

# No ecom.outbox.client / ecom.inbox.client here: nothing is published and nothing is consumed from Kafka, so the tests
# feed events to the inbox directly and read the outbox table.
outbox:
  relay:
    enabled: false

inventory:
  reservation:
    expiry-enabled: false
