spring:
  datasource:
    url: jdbc:h2:mem:checkout_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

# No ecom.outbox.client here: nothing is published, so the events stay in the outbox table where the tests read them.
outbox:
  relay:
    enabled: false

checkout:
  expiry:
    enabled: false

# The tests replace both with a local stub server.
services:
  inventory:
    base-url: http://localhost:1
  product-query:
    base-url: http://localhost:1
