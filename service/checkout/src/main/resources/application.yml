server:
  port: ${PORT:8084}

spring:
  application:
    name: checkout
  profiles:
    # The profile also selects which ecom-infra-<profile>.yml says where RabbitMQ and the other clients are.
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    show-sql: false

outbox:
  poll-interval-ms: 1000
  relay:
    batch-size: 50
    lease-seconds: 30

checkout:
  expiry:
    enabled: true
    interval-ms: 60000

services:
  inventory:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  product-query:
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
