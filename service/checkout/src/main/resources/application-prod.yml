# Production: every connection detail and secret must come from the environment (no defaults).
# Where RabbitMQ is comes from ecom-infra-prod.yml or from ECOM_CLIENT_RABBIT_CORE_HOST.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

services:
  identity:
    base-url: ${IDENTITY_SERVICE_URL}
    client-id: ${CHECKOUT_CLIENT_ID:checkout-service}
    client-secret: ${CHECKOUT_CLIENT_SECRET}
  inventory:
    base-url: ${INVENTORY_SERVICE_URL}
  listing:
    base-url: ${LISTING_SERVICE_URL}

ecom:
  security:
    jwt:
      jwks-uri: ${IDENTITY_JWKS_URI}
  outbox:
    client: rabbit.core
