server:
  port: ${PORT:8081}

spring:
  application:
    name: listing
  profiles:
    # The profile also selects which ecom-infra-<profile>.yml says where Kafka and the other clients are.
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    show-sql: false

outbox:
  poll-interval-ms: 1000
  relay:
    batch-size: 50
    lease-seconds: 30
