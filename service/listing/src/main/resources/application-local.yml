# Runs against the containers from bootstrap/local (bootstrap/local/local.ps1 up).
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/listing_db}
    username: ${SPRING_DATASOURCE_USERNAME:ecom}
    password: ${SPRING_DATASOURCE_PASSWORD:ecom}
  jpa:
    hibernate:
      ddl-auto: update

listing:
  images:
    # only files uploaded through the asset service (local S3 stand-in) can be attached to a product
    allowed-prefixes: ${LISTING_IMAGE_PREFIXES:http://localhost:9090/ecom-assets/images/}

ecom:
  security:
    jwt:
      jwks-uri: ${IDENTITY_JWKS_URI:http://localhost:8086/.well-known/jwks.json}
  outbox:
    # Publish the events through the RabbitMQ client the profile calls "core"; infra says where it is.
    client: rabbit.core
