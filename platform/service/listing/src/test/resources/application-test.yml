spring:
  datasource:
    url: jdbc:h2:mem:listing_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

# No ecom.outbox.client here: nothing is published, so the events stay in the outbox table where the tests read them.
outbox:
  relay:
    enabled: false
