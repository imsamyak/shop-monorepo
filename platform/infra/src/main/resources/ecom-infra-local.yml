# Where the clients live when the "local" profile is active: Docker containers on this machine.
# Only "where": which client a module uses is the service's decision (ecom.outbox.client: rabbit.core).
# Every name defined here must also exist in the other profiles' files.
# Loaded at the lowest priority, so the service's own configuration overrides anything here.
# Only non-secret values belong in these files. Real AWS access uses the IAM role / default credential chain.
ecom:
  client:
    kafka:
      core:
        bootstrap-servers: localhost:9092

    rabbit:
      core:
        host: localhost
        port: 5672
        # the broker's built-in local account; it only accepts connections from this machine
        username: guest
        password: guest

    dynamodb:
      main:
        region: ap-south-1
        endpoint: http://localhost:8000
        # DynamoDB Local requires some key but does not check it
        access-key-id: local
        secret-access-key: local

    s3:
      assets:
        bucket: ecom-assets
        region: ap-south-1
        # S3Mock stands in for S3; it needs the bucket in the path
        endpoint: http://localhost:9090
        path-style: true
        # any key will do, S3Mock does not check it
        access-key-id: local
        secret-access-key: local

    mongodb:
      main:
        # the local container runs without authentication
        uri: mongodb://localhost:27017
